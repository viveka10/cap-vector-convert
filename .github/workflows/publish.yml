name: Publish to npm

# Runs when a version tag is pushed, e.g. `npm version patch && git push --follow-tags`
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5, required for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm test

      # Uses trusted publishing (OIDC) once it is configured on npmjs.com;
      # until then falls back to the NPM_TOKEN repository secret.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
